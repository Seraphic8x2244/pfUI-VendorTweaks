name: VendorTweaks v0.1.24 icon repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply icon repair update
        shell: bash
        run: |
          python3 update_v0124.py
          rm -f update_v0124.py
          rm -f .github/workflows/vendor-tweaks-v0.1.24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add on-demand icon repair"
          git push
