name: VendorTweaks v0.1.25 alphabetical sorting

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply alphabetical sorting
        shell: bash
        run: |
          python3 update_sort_lists.py
          rm -f update_sort_lists.py
          rm -f .github/workflows/vendor-tweaks-v0.1.25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sort VendorTweaks lists alphabetically"
          git push
