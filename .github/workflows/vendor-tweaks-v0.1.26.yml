name: VendorTweaks v0.1.26 vendor purchase exemption

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply vendor purchase exemption
        shell: bash
        run: |
          python3 update_vendor_purchase_exemption.py
          rm -f update_vendor_purchase_exemption.py
          rm -f .github/workflows/vendor-tweaks-v0.1.26.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exempt vendor purchases from Auto-Delete"
          git push
