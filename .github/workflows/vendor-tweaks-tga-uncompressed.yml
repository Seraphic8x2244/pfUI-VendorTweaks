name: VendorTweaks TGA compatibility pass

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/vendor-tweaks-tga-uncompressed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Convert sprite to uncompressed 32-bit TGA
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          path = "vendor-tweaks-burn.tga"
          image = Image.open(path).convert("RGBA")
          if image.size != (256, 32):
              raise SystemExit("unexpected sprite size: %r" % (image.size,))
          image.save(path)
          with open(path, "rb") as f:
              header = f.read(18)
          if header[2] != 2 or header[16] != 32:
              raise SystemExit("expected uncompressed type-2 32-bit TGA")
          PY
      - name: Commit converted asset and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/vendor-tweaks-tga-uncompressed.yml
          git add vendor-tweaks-burn.tga
          git commit -m "Store burn sprite as uncompressed TGA"
          git push origin HEAD:dev
