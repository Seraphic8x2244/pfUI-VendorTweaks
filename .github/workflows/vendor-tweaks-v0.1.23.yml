name: VendorTweaks v0.1.23 translations

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply translations
        shell: bash
        run: |
          python3 update_vendor_v023.py
          rm -f update_vendor_v023.py
          rm -f .github/workflows/vendor-tweaks-v0.1.23.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add VendorTweaks translations"
          git push
