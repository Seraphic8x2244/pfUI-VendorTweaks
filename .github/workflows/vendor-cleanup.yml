name: VendorTweaks one-shot cleanup

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lua = Path('pfUI-VendorTweaks.lua')
          s = lua.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing expected block: {label}')
              s = s.replace(old, new, 1)

          replace_once('-- pfUI-VendorTweaks v0.1.18', '-- pfUI-VendorTweaks v0.1.19', 'version header')

          replace_once('''  -- pfUI's modern checkbox skin builds its backdrop from child frames. A texture
          -- on the CheckButton itself can therefore render underneath that backdrop even
          -- on the OVERLAY draw layer. Keep the mark on its own child frame above every
          -- pfUI backdrop frame instead of relying on SetCheckedTexture().
          local function AttachCheckboxMark(cb)
            local mark = CreateFrame("Frame", nil, cb)
            mark:SetAllPoints(cb)

            local level = cb:GetFrameLevel() + 1
            if cb.backdrop and cb.backdrop.GetFrameLevel and cb.backdrop:GetFrameLevel() >= level then
              level = cb.backdrop:GetFrameLevel() + 1
            end
            if cb.backdrop_border and cb.backdrop_border.GetFrameLevel and cb.backdrop_border:GetFrameLevel() >= level then
              level = cb.backdrop_border:GetFrameLevel() + 1
            end
            mark:SetFrameLevel(level)
            mark:EnableMouse(false)
          ''','''  -- pfUI skins may build their backdrop from child frames, so an OVERLAY texture
          -- on the owner itself can still render underneath the skin. Centralize the one
          -- compatibility rule used by both checkbox marks and drop-animation visuals.
          local function RaiseAboveBackdrop(child, owner)
            local level = owner:GetFrameLevel() + 1

            if owner.backdrop and owner.backdrop.GetFrameLevel and owner.backdrop:GetFrameLevel() >= level then
              level = owner.backdrop:GetFrameLevel() + 1
            end
            if owner.backdrop_border and owner.backdrop_border.GetFrameLevel and owner.backdrop_border:GetFrameLevel() >= level then
              level = owner.backdrop_border:GetFrameLevel() + 1
            end

            child:SetFrameLevel(level)
          end

          local function AttachCheckboxMark(cb)
            local mark = CreateFrame("Frame", nil, cb)
            mark:SetAllPoints(cb)
            RaiseAboveBackdrop(mark, cb)
            mark:EnableMouse(false)
          ''','layer helper')

          replace_once('''    -- pfUI's backdrop is made from child frames, so an arbitrary +N frame
              -- level is not reliable. Mirror the proven checkbox-mark approach and
              -- explicitly sit above whichever backdrop frame is actually highest.
              local visualLevel = drop:GetFrameLevel() + 1
              if drop.backdrop and drop.backdrop.GetFrameLevel and drop.backdrop:GetFrameLevel() >= visualLevel then
                visualLevel = drop.backdrop:GetFrameLevel() + 1
              end
              if drop.backdrop_border and drop.backdrop_border.GetFrameLevel and drop.backdrop_border:GetFrameLevel() >= visualLevel then
                visualLevel = drop.backdrop_border:GetFrameLevel() + 1
              end
              visual:SetFrameLevel(visualLevel)
              visual:EnableMouse(false)
          ''','''    RaiseAboveBackdrop(visual, drop)
              visual:EnableMouse(false)
          ''','animation layering')

          replace_once('''  local function MakeDropAnimator(drop, listFrame)''','''  local function MakeDropAnimator(drop)''','animator signature')

          replace_once('''    local elapsed = 0
              local running = false
              local startX, startY = 0, 0
              local targetX, targetY = 0, -55

              drop:SetScript("OnUpdate", function()
                if not running then return end

                elapsed = elapsed + arg1
                local flashTime = .18
                local slideTime = .42

                if elapsed <= flashTime then
                  local pulse = math.abs(math.sin((elapsed / flashTime) * math.pi * 2))
          ''','''    local elapsed = 0
              local running = false
              local startX, startY = 0, 0
              local targetX, targetY = -7, -55
              local FLASH_TIME = .18
              local SLIDE_TIME = .42

              drop:SetScript("OnUpdate", function()
                if not running then return end

                elapsed = elapsed + arg1

                if elapsed <= FLASH_TIME then
                  local pulse = math.abs(math.sin((elapsed / FLASH_TIME) * math.pi * 2))
          ''','animation timing/target')

          replace_once('local t = (elapsed - flashTime) / slideTime', 'local t = (elapsed - FLASH_TIME) / SLIDE_TIME', 'animation timing use')

          replace_once('''    function animator:Play(texture)
              local dropX, dropY = drop:GetCenter()
              local listLeft = listFrame:GetLeft()
              local listTop = listFrame:GetTop()

              startX, startY = 0, 0
              if dropX and dropY and listLeft and listTop then
                targetX = (listLeft + 14) - dropX
                targetY = (listTop - 12) - dropY
              else
                targetX, targetY = 0, -55
              end

              elapsed = 0
          ''','''    function animator:Play(texture)
              startX, startY = 0, 0
              targetX, targetY = -7, -55

              elapsed = 0
          ''','animation target calculation')

          replace_once('local vendorDropAnim = MakeDropAnimator(vendorDrop, vendorScroll)', 'local vendorDropAnim = MakeDropAnimator(vendorDrop)', 'vendor animator call')
          replace_once('local deleteDropAnim = MakeDropAnimator(deleteDrop, deleteScroll)', 'local deleteDropAnim = MakeDropAnimator(deleteDrop)', 'delete animator call')

          replace_once('''    local name, _, _, _, _, _, _, _, _, texture = GetItemInfo(itemLink or itemID)
              if not name or not texture then
          ''','''    local name, _, _, _, _, _, _, _, _, texture = GetItemInfo(itemLink or itemID)
              if itemLink and (not name or not texture) then
          ''','duplicate item lookup guard')

          lua.write_text(s)

          toc = Path('pfUI-VendorTweaks.toc')
          t = toc.read_text()
          if '## Version: 0.1.18' not in t:
              raise SystemExit('missing expected toc version')
          toc.write_text(t.replace('## Version: 0.1.18', '## Version: 0.1.19', 1))
          PY

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/vendor-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pfUI-VendorTweaks.lua pfUI-VendorTweaks.toc
          git commit -m "Refactor icon animation handling"
          git push
