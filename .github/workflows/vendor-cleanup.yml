name: VendorTweaks one-shot cleanup

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.1.19 animation cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lua = Path('pfUI-VendorTweaks.lua')
          lines = lua.read_text().splitlines()

          def unique(text, label):
              matches = [i for i, line in enumerate(lines) if line == text]
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {len(matches)}')
              return matches[0]

          lines[unique('-- pfUI-VendorTweaks v0.1.18', 'Lua version')] = '-- pfUI-VendorTweaks v0.1.19'
          lines[unique('  local function MakeDropAnimator(drop, listFrame)', 'animator signature')] = '  local function MakeDropAnimator(drop)'
          lines[unique('    local targetX, targetY = 0, -55', 'default target')] = '    local targetX, targetY = -7, -55'

          play = unique('    function animator:Play(texture)', 'animator Play')
          elapsed = next((i for i in range(play + 1, len(lines)) if lines[i] == '      elapsed = 0'), None)
          if elapsed is None:
              raise SystemExit('animator Play: elapsed marker not found')
          lines[play + 1:elapsed] = [
              '      startX, startY = 0, 0',
              '      targetX, targetY = -7, -55',
              '',
          ]

          lines[unique('  local vendorDropAnim = MakeDropAnimator(vendorDrop, vendorScroll)', 'vendor animator call')] = '  local vendorDropAnim = MakeDropAnimator(vendorDrop)'
          lines[unique('  local deleteDropAnim = MakeDropAnimator(deleteDrop, deleteScroll)', 'delete animator call')] = '  local deleteDropAnim = MakeDropAnimator(deleteDrop)'

          result = '\n'.join(lines) + '\n'

          # Preserve the working icon-acquisition and failure-feedback paths.
          if 'INV_Misc_QuestionMark' not in result:
              raise SystemExit('question-mark fallback was lost')
          if 'local bagTexture = GetContainerItemInfo(bag, slot)' not in result:
              raise SystemExit('bag texture recovery was lost')
          if 'local visualLevel = drop:GetFrameLevel() + 1' not in result:
              raise SystemExit('working pfUI layering path was changed')
          if 'listFrame' in result:
              raise SystemExit('stale listFrame reference remains')

          lua.write_text(result)

          toc = Path('pfUI-VendorTweaks.toc')
          t = toc.read_text()
          if t.count('## Version: 0.1.18') != 1:
              raise SystemExit('TOC version: expected exactly one 0.1.18')
          toc.write_text(t.replace('## Version: 0.1.18', '## Version: 0.1.19', 1))
          PY

      - name: Commit and remove one-shot files
        shell: bash
        run: |
          git rm .github/workflows/vendor-cleanup.yml .github/vendor-cleanup-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pfUI-VendorTweaks.lua pfUI-VendorTweaks.toc
          git commit -m "Refine VendorTweaks icon animation"
          git push
